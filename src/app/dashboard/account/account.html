<section>
  <h1>Your account</h1>
  <div class="account-details">
    <h2>Account Details</h2>
    <p>Email: {{ authService.currentUser()?.email }}</p>
    <p>UserName: {{ authService.currentUser()?.displayName }}</p>
    <span>
      <button>Change Username</button>
      <button>Change Password</button>
    </span>
  </div>
  <section class="Prefrences">
    <h2>Preferences</h2>
    <p>Current Theme: {{ profile()?.preferences?.theme ?? 'Not set' }}</p>
    <button type="button" [disabled]="isSavingTheme()" (click)="changeTheme()">
      {{ isSavingTheme() ? 'Saving...' : 'Change Theme' }}
    </button>
    @if (accountError()) {
      <p role="alert">{{ accountError() }}</p>
    }
  </section>
</section>
