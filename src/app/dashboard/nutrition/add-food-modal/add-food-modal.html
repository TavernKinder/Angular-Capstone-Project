<app-dialog heading="Add to your food log" (closed)="closed.emit()">
  <div class="mb-5">
    <p class="font-bold">{{ food().name }}</p>
    @if (food().brand) {
      <p class="text-xs text-brand-muted uppercase tracking-wide">{{ food().brand }}</p>
    }
    <p class="text-[10px] text-brand-muted mt-3 mb-1 font-bold uppercase tracking-widest">Macros / 100g</p>
    <p class="text-sm text-brand-muted">
      {{ food().calories ?? '-' }} kcal &middot; Protein {{ food().protein ?? '-' }}g &middot;
      Carbs {{ food().carbs ?? '-' }}g &middot; Fat {{ food().fat ?? '-' }}g
    </p>
  </div>

  <button
    type="button"
    class="w-full px-4 py-2.5 rounded-sm bg-brand-primary text-on-brand-primary font-semibold hover:bg-brand-primary-hover disabled:opacity-60"
    [disabled]="isSaving()"
    (click)="addToToday()"
  >
    {{ isSaving() ? 'Saving...' : 'Add to today' }}
  </button>

  <div class="mt-5 pt-5 border-t border-line">
    <label class="block text-xs font-bold uppercase tracking-wider mb-2" for="past-date">
      Or add to a previous day
    </label>
    <div class="flex gap-3">
      <input
        id="past-date"
        type="date"
        class="flex-1 min-w-0 px-3 py-2 rounded-sm border border-line bg-field"
        [max]="today"
        [ngModel]="pastDate()"
        (ngModelChange)="pastDate.set($event)"
      />
      <button
        type="button"
        class="px-4 py-2 rounded-sm border border-line font-semibold hover:bg-canvas disabled:opacity-60"
        [disabled]="isSaving() || !pastDate() || pastDate() > today"
        (click)="addToPastDate()"
      >
        Add
      </button>
    </div>
  </div>
</app-dialog>
