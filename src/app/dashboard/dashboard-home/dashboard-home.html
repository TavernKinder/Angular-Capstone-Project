<div class="dashboard-container p-6 max-w-7xl mx-auto min-h-[calc(100vh-200px)]">
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-800">Welcome Back!</h1>
    <p class="text-gray-500">Here's your daily summary.</p>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <!-- Weather Widget Bubble -->
    <div class="col-span-1 lg:col-span-2 bg-white/50 backdrop-blur-xl border border-gray-100 shadow-xl rounded-[2.5rem] overflow-hidden">
      <!-- Instead of rewriting, we just drop the component! -->
      <app-forcast></app-forcast>
    </div>

    <!-- Other placeholders for future widgets (Nutrition, Workout) -->
    <div class="col-span-1 flex flex-col gap-6">
      <div class="bg-gradient-to-br from-purple-500 to-fuchsia-600 rounded-[2.5rem] p-8 text-white shadow-lg h-full flex flex-col justify-between relative overflow-hidden">
        <div class="absolute top-0 right-0 w-32 h-32 bg-white opacity-10 rounded-full -mt-10 -mr-10"></div>
        <div>
          <h2 class="text-2xl font-bold mb-2">Nutrition</h2>
          <p class="opacity-90">Log your meals to track macros today.</p>
        </div>
        <a href="/dashboard/nutrition" class="mt-8 bg-white/20 hover:bg-white/30 backdrop-blur-md px-6 py-3 rounded-full text-center font-medium transition-colors cursor-pointer w-max">
          Open Nutrition Log
        </a>
      </div>

      <div class="bg-gradient-to-br from-emerald-400 to-teal-500 rounded-[2.5rem] p-8 text-white shadow-lg h-full flex flex-col justify-between relative overflow-hidden">
        <div class="absolute bottom-0 left-0 w-32 h-32 bg-white opacity-10 rounded-full -mb-10 -ml-10"></div>
        <div>
          <h2 class="text-2xl font-bold mb-2">Workouts</h2>
          <p class="opacity-90">Ready to crush your goals?</p>
        </div>
        <a href="/dashboard/workout" class="mt-8 bg-white/20 hover:bg-white/30 backdrop-blur-md px-6 py-3 rounded-full text-center font-medium transition-colors cursor-pointer w-max">
          Log Workout
        </a>
      </div>
    </div>
  </div>
</div>
