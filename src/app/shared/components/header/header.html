<header class="site-header">
  <nav class="site-nav" aria-label="Main navigation">
    <a class="site-home" routerLink="/">Home</a>
    <div class="site-links">
      @if (authService.currentUser()) {
        <a class="nav-button" routerLink="/dashboard">Dashboard</a>
        <a routerLink="/dashboard/account">Account details</a>
      } @else {
        <a routerLink="/login">Log in</a>
        <a class="nav-button" routerLink="/signup">Sign up</a>
      }
    </div>
  </nav>
</header>
