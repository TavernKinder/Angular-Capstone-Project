<app-dialog [heading]="heading()" (closed)="cancelled.emit()">
  <p class="text-sm text-brand-muted mb-6">{{ message() }}</p>
  <div class="flex justify-end gap-3">
    <button
      type="button"
      class="px-4 py-2 rounded-sm border border-line text-sm font-semibold hover:bg-canvas"
      (click)="cancelled.emit()"
    >
      Cancel
    </button>
    <button
      type="button"
      class="px-4 py-2 rounded-sm bg-danger-btn text-on-danger text-sm font-semibold hover:bg-danger-btn-hover disabled:opacity-60"
      [disabled]="isBusy()"
      (click)="confirmed.emit()"
    >
      {{ isBusy() ? 'Working...' : confirmLabel() }}
    </button>
  </div>
</app-dialog>
