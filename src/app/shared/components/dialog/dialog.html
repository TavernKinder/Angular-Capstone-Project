<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-xs"
  (click)="closed.emit()"
>
  <section
    class="relative w-full max-w-md max-h-[90vh] overflow-y-auto bg-surface text-brand-primary border border-line rounded-sm p-6 shadow-2xl"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="titleId"
    (click)="$event.stopPropagation()"
  >
    <button
      type="button"
      class="absolute top-3 right-3 p-2 rounded-full text-brand-muted hover:text-brand-primary hover:bg-canvas transition-colors"
      aria-label="Close"
      (click)="closed.emit()"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
    <h2 [id]="titleId" class="text-xl font-bold mb-4 pr-8">{{ heading() }}</h2>
    <ng-content />
  </section>
</div>
